<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrito · Farmanova</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="data.js"></script><script src="app.js" defer></script></head><body data-p="carro"><main class="w"><h1 style="padding-top:28px">Tu carrito</h1><div class="ct"><div id="items"></div><form class="box" id="f"><div id="sum"></div><label>Nombre completo</label><input name="n" required><label>Teléfono</label><input name="t" type="tel" required><label>Dirección de entrega</label><input name="d" required><label>Forma de pago</label><div class="pay"><label class="po"><input type="radio" name="p" value="WhatsApp" checked><span><b>Vía WhatsApp</b><small>Coordinas el pago con nosotros por chat</small></span></label><label class="po"><input type="radio" name="p" value="Transfermóvil"><span><b>Vía Transfermóvil</b><small>Paga con QR o desde la app</small></span></label></div><div id="tm" hidden></div><label>Notas (opcional)</label><textarea name="o" rows="2"></textarea><label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:14px"><input type="checkbox" name="ok" required style="width:auto;margin-top:4px;accent-color:var(--pine)"><span>Acepto que guarden mis datos para gestionar mi pedido (ver <a href="info.html#privacidad">privacidad</a>).</span></label><p style="font-size:14px;color:var(--mut)">Al pulsar, se abrirá WhatsApp con tu pedido listo para enviar. El pedido se confirma cuando te respondamos.</p><button class="btn wa" id="go" style="width:100%">Pedir por WhatsApp</button></form></div></main></body></html>
